services:
  - type: web
    name: fraudcatua
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: SPEECHMATICS_API_KEY
        sync: false
      - key: NEON_AI_GATEWAY_TOKEN
        sync: false
      - key: NEON_AI_GATEWAY_BASE_URL
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
